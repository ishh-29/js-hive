<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather-app.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text"placeholder="Enter City Name"spellcheck="false">
            <button><img src="resource/search.png"></button>
        </div>
        <div class="error">
            <p>City Not Found</p>
        </div>
        <div class="weather">
            <img src="resource/rain.png" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="cols">
                    <img src="resource/humidity.png">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="cols">
                    <img src="resource/wind.png">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const apikey="ba9e0e6c66093dfbecb32fbc0af7d411";
        const apiurl="https://api.openweathermap.org/data/2.5/weather?units=metric&q=";
        const search_box=document.querySelector(".search input");
        const search_btn=document.querySelector(".search button");
        const icon=document.querySelector(".weather-icon");
        async function check_weather(city){
            const response=await fetch(apiurl+city+`&appid=${apikey}`);
            if(response.status==404){
                document.querySelector(".error").style.display="block";
                document.querySelector(".weather").style.display="none";
            }
            else{
                var data=await response.json();
                console.log(data);
                document.querySelector(".city").innerHTML=data.name;
                document.querySelector(".temp").innerHTML=Math.round(data.main.temp)+"°C";
                document.querySelector(".humidity").innerHTML=data.main.humidity+"%";
                document.querySelector(".wind").innerHTML=data.wind.speed+" km/h";
                if(data.weather[0].main=="Clouds") icon.src="resource/cloud.png";
                else if(data.weather[0].main=="Clear") icon.src="resource/clear.png";
                else if(data.weather[0].main=="Rain") icon.src="resource/rain.png";
                else if(data.weather[0].main=="Drizzle") icon.src="resource/drizzle.png";
                else if(data.weather[0].main=="Mist") icon.src="resource/mist.png";
                document.querySelector(".weather").style.display="block";
                document.querySelector(".error").style.display="none";
            }
        }
        search_btn.addEventListener("click",()=>{
            check_weather(search_box.value);
            }
        );
    </script>
</body>
</html>
